# nginx in front of "dbtwin serve": nginx does HTTPS, dbtwin stays on 127.0.0.1.
# Use this if you already run nginx. Otherwise set "api_domain" in
# /etc/dbtwin/config.json and dbtwin does HTTPS by itself.
#
# 1. change dbtwin.example.com to your domain (it must point to this server)
# 2. copy this file to /etc/nginx/sites-available/dbtwin
#    and run: sudo ln -s /etc/nginx/sites-available/dbtwin /etc/nginx/sites-enabled/
# 3. get a free certificate: sudo certbot --nginx -d dbtwin.example.com
#    (certbot adds the HTTPS lines to this file by itself)
# 4. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name dbtwin.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;

        # a create or reset can take up to 2 minutes; nginx's default
        # is 60 seconds, which would cut it off half way
        proxy_read_timeout 130s;
    }
}
